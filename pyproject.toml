[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stockagent"
version = "0.2.0"
description = "AI-driven autonomous stock investment agent"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "ta>=0.11.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.20.0"]
google = ["google-generativeai>=0.4.0"]
ibkr = ["ib_insync>=0.9.86", "nest-asyncio>=1.5.0"]
viz = ["matplotlib>=3.7.0", "numpy>=1.24.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
stockagent = "cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agents", "analysis", "backtest", "core", "data", "execution", "push"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
